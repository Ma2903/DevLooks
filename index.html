<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- 🎯 SEO Básico -->
    <meta name="description" content="DevLooks - E-commerce acadêmico para desenvolvedores. Projeto educacional com Vue.js, Node.js e integração Mercado Pago.">
    <meta name="keywords" content="ecommerce, devlooks, vue, nodejs, mercado pago, projeto acadêmico">
    <meta name="author" content="Mayara Silva">
    <meta name="robots" content="index, follow">
    
    <!-- 🌐 Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://devlooks.vercel.app/">
    <meta property="og:title" content="DevLooks - E-commerce para Desenvolvedores">
    <meta property="og:description" content="Projeto acadêmico de e-commerce desenvolvido com tecnologias modernas.">
    <meta property="og:site_name" content="DevLooks">
    <meta property="og:locale" content="pt_BR">
    
    <!-- 🐦 Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="DevLooks - E-commerce para Desenvolvedores">
    <meta name="twitter:description" content="Projeto acadêmico de e-commerce desenvolvido com Vue.js e Node.js">
    
    <!-- 🎨 Theme Color -->
    <meta name="theme-color" content="#04d1b0">
    
    <!-- 📱 Apple -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <!-- ⚡ Preconnect para melhor performance -->
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="dns-prefetch" href="https://sdk.mercadopago.com">
    <link rel="dns-prefetch" href="https://api.mercadopago.com">
    <link rel="dns-prefetch" href="https://cdn.pixabay.com">
    
    <!-- ⚡ FontAwesome subset otimizado - apenas solid -->
    <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/fontawesome.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'" crossorigin>
    <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/solid.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'" crossorigin>
    <noscript>
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/fontawesome.min.css" crossorigin>
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/solid.min.css" crossorigin>
    </noscript>
    
    <style>
      /* ⚡ Critical CSS inline para First Paint */
      body{margin:0;background:#111827;color:#f9fafb;font-family:system-ui,-apple-system,sans-serif}
      #app{min-height:100vh}
    </style>
    
    <!-- Preload critical CSS -->
    <link rel="preload" href="/view/assets/main.css" as="style">
    
    <!-- 🔗 Favicon -->
    <link rel="icon" href="/favicon.png" type="image/png">
    
    <!-- 📱 PWA Manifest -->
    <link rel="manifest" href="/manifest.json">
    
    <title>DevLooks - E-commerce para Desenvolvedores</title>
    
    <style>
      /* ⚡ Critical CSS inline para First Paint */
      body{margin:0;background:#111827;color:#f9fafb;font-family:system-ui,-apple-system,sans-serif}
      #app{min-height:100vh}
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/view/main.js"></script>
  </body>
</html>
